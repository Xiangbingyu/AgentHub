[project]
name = "agenthub-service"
version = "0.1.0"
description = "FastAPI service scaffold for AgentHub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "ruff>=0.11.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_service/app"]

[tool.pytest.ini_options]
pythonpath = [".", "gateway-service"]
testpaths = ["agent_service/tests", "gateway-service/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
