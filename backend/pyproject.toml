[project]
name = "agenthub-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for AgentHub based on AgentScope."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentscope[service]>=2.0.1",
    "fastapi[standard]>=0.115.12",
    "pydantic-settings>=2.9.1",
    "redis>=6.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
